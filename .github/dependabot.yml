# Les actions du workflow sont épinglées par empreinte de commit : sans Dependabot,
# leurs mises à jour passeraient inaperçues. Même suivi pour les dépendances du site et de l'API.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mineures:
        update-types: [minor, patch]
    ignore:
      # Les types suivent la version de Node de la CI (24), pas la dernière publiée
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 n'a pas encore d'API pour typescript-eslint : rester en 6.0 jusqu'à sa prise en charge
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mineures:
        update-types: [minor, patch]
    ignore:
      # l5-swagger 10 et plus ne lit plus les annotations en docblock : à reprendre avec le passage
      # à Laravel 13, en convertissant les annotations des contrôleurs en attributs PHP
      - dependency-name: darkaonline/l5-swagger
        update-types: [version-update:semver-major]
